name: Validate repository

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            AGENTS.md
            docs/SPEC.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/RELEASE_CHECKLIST.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject unresolved merge markers and machine paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)|/Users/[^/]+/|<owner>' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Repository contains a merge marker, machine-specific path, or owner placeholder."
            exit 1
          fi

      - name: Reject common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|ntn_[A-Za-z0-9]{20,})' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Potential credential detected."
            exit 1
          fi

  go:
    name: Go build, vet and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # v1.0 supports Linux, macOS and Windows, so all three are built and
        # tested here rather than assumed from one.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The scanner adapters shell out to gitleaks and osv-scanner. Those tests
      # skip, naming the missing binary, when it is not installed — so this job
      # proves the core, the normalizer and the MCP surface on every platform,
      # and the real-tool adapters only where the tools exist.
      - name: Test
        run: go test ./...
