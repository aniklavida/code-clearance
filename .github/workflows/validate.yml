name: Validate repository

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            AGENTS.md
            docs/SPEC.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/RELEASE_CHECKLIST.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject unresolved merge markers and machine paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)|/Users/[^/]+/|<owner>' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Repository contains a merge marker, machine-specific path, or owner placeholder."
            exit 1
          fi

      - name: Reject common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|ntn_[A-Za-z0-9]{20,})' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Potential credential detected."
            exit 1
          fi

  go:
    name: Go build, vet and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # v1.0 supports Linux, macOS and Windows, so all three are built and
        # tested here rather than assumed from one.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The scanner adapters shell out to gitleaks and osv-scanner.
      # We install them here so the real-tool adapter tests actually run
      # and prove the adapters work against the real binaries, rather than
      # silently skipping.
      - name: Install Scanners
        shell: bash
        run: |
          go install -ldflags="-X=github.com/zricethezav/gitleaks/v8/cmd.Version=8.18.4" github.com/zricethezav/gitleaks/v8@v8.18.4
          
          OS="${{ runner.os }}"
          ARCH="${{ runner.arch }}"
          if [ "$OS" = "Linux" ]; then OS="linux"; elif [ "$OS" = "macOS" ]; then OS="darwin"; elif [ "$OS" = "Windows" ]; then OS="windows"; fi
          if [ "$ARCH" = "X64" ]; then ARCH="amd64"; elif [ "$ARCH" = "ARM64" ]; then ARCH="arm64"; fi
          
          EXT=""
          if [ "$OS" = "windows" ]; then EXT=".exe"; fi
          
          URL="https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_${OS}_${ARCH}${EXT}"
          curl -sL "$URL" -o "$(go env GOPATH)/bin/osv-scanner${EXT}"
          chmod +x "$(go env GOPATH)/bin/osv-scanner${EXT}"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./... | tee test.log
          
          # Ensure requireTool-gated tests actually executed and did not skip
          # due to missing binaries.
          SKIPPED_TESTS=$(grep -E "--- SKIP: (TestGitleaks_RealProcess_FindsFixtureSecrets|TestOSVScanner_RealProcess_FindsVulnerableLockfile|TestGitleaks_RealProcess_CleanDirectoryReportsOK|TestOSVScanner_RealProcess_HungProcessKilledByTimeout|TestGitleaks_TimedOutRunIsNeverReportedAsAPass|TestAdapters_RawOutputRetainedInStoreAndReferencedInFindings|TestOSVScanner_RawOutputRetainedInStoreAndReferencedInFindings|TestAdapters_CrashingAdapterDoesNotCorruptOtherResults|TestGitleaks_RecordedCommandIsTheCommandThatRan|TestUnattendedAgentLoopReal|TestDetectToolVersion_RealInstalledTools)" test.log || true)
          
          if [ -n "$SKIPPED_TESTS" ]; then
            echo "ERROR: The following real-tool tests were skipped:"
            echo "$SKIPPED_TESTS"
            echo "This indicates gitleaks or osv-scanner was not installed properly on the runner."
            exit 1
          fi
